defaults:
  - new_conf

wandb:
  team: "pavalipopov"  # Your specified team name
  project: "multimodal-subnetworks-rev"  # Your requested project name

# Dense multimodal with per-modality classifier heads (shared backbone).
experiment:
  experiment_name: fbirn_multihead_dense
  collections: fbirn
  dbfields: [falff, smri, dwi]  # All three modalities
  metafields: [gender_encoded]
  cv_folds: 10
  epochs: 60

model:
  masked: False
  multihead: True
  model_channels: 64
